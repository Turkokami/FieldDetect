<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ACE Trainer</title>
<meta name="description" content="A clean, mobile-first study hub for the ACE certification: section breakdowns, practice tests, flashcards, videos, and audio guides." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%235B7CFA%27/%3E%3Ctext x=%2750%27 y=%2770%27 font-size=%2758%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial%27 font-weight=%27bold%27%3EA%3C/text%3E%3C/svg%3E" />
<style>
/* ---------- Design tokens ---------- */
:root{
  --accent:#5B7CFA; --accent-ink:#ffffff;
  --ok:#22C55E; --no:#EF4444; --flag:#F59E0B;
  --bg:#0e131c; --surface:#161d2b; --surface-2:#1e2636; --raised:#232c40;
  --border:#2a3346; --border-soft:#222a3b;
  --text:#e8edf6; --muted:#93a1bb; --faint:#6b7a97;
  --radius:16px; --radius-sm:11px;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --tabbar-h:64px; --appbar-h:56px;
  --maxw:680px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f1f4fa; --raised:#ffffff;
    --border:#e2e8f2; --border-soft:#eaeff7;
    --text:#141b28; --muted:#5b6a86; --faint:#8592ab;
    --shadow:0 8px 24px rgba(23,42,84,.08);
  }
}
:root[data-theme="dark"]{
  --bg:#0e131c; --surface:#161d2b; --surface-2:#1e2636; --raised:#232c40;
  --border:#2a3346; --border-soft:#222a3b;
  --text:#e8edf6; --muted:#93a1bb; --faint:#6b7a97; --shadow:0 8px 24px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f1f4fa; --raised:#ffffff;
  --border:#e2e8f2; --border-soft:#eaeff7;
  --text:#141b28; --muted:#5b6a86; --faint:#8592ab; --shadow:0 8px 24px rgba(23,42,84,.08);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; line-height:1.5;
  overscroll-behavior-y:none;
}
button{font-family:inherit;}
a{color:var(--accent);text-decoration:none;}

.app{max-width:var(--maxw);margin:0 auto;min-height:100vh;position:relative;background:var(--bg);}

/* ---------- App bar ---------- */
.appbar{
  position:sticky;top:0;z-index:40;height:var(--appbar-h);
  display:flex;align-items:center;gap:12px;padding:0 16px;
  padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--border-soft);
}
.appbar .logo{
  width:30px;height:30px;border-radius:9px;background:var(--accent);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:0 0 auto;
}
.appbar .titles{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
.appbar .titles b{font-size:15px;letter-spacing:-.01em;}
.appbar .titles span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.appbar .spacer{margin-left:auto;}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;font-size:16px;
}
.icon-btn:active{transform:scale(.94);}

/* ---------- View / tabs ---------- */
.view{padding:16px 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 20px);}
.panel{display:none;animation:fade .18s ease;}
.panel.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.panel.active{animation:none;} *{scroll-behavior:auto;}}

.panel-head{margin:2px 0 14px;}
.panel-head h1{font-size:23px;letter-spacing:-.02em;margin:0 0 3px;text-wrap:balance;}
.panel-head p{margin:0;color:var(--muted);font-size:14px;}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);}

/* ---------- Bottom tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;max-width:var(--maxw);margin:0 auto;
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--border);
}
.tabbar button{
  flex:1;border:none;background:none;cursor:pointer;color:var(--faint);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:600;letter-spacing:.01em;padding:6px 2px;position:relative;
  transition:color .15s;
}
.tabbar button .ic{width:24px;height:24px;display:grid;place-items:center;}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.tabbar button.active{color:var(--accent);}
.tabbar button.active .ic{transform:translateY(-1px);}
.tabbar button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:10px;}

/* ---------- Cards / accordion ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.stack{display:flex;flex-direction:column;gap:12px;}

.acc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.acc + .acc{margin-top:12px;}
.acc summary{
  list-style:none;cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:13px;
  user-select:none;
}
.acc summary::-webkit-details-marker{display:none;}
.acc summary:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;}
.acc .num{
  flex:0 0 auto;width:34px;height:34px;border-radius:10px;font-weight:800;font-size:14px;
  display:grid;place-items:center;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 15%,transparent);
}
.acc .lbl{flex:1;min-width:0;}
.acc .lbl b{display:block;font-size:15.5px;letter-spacing:-.01em;line-height:1.25;}
.acc .lbl span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;}
.acc .chev{flex:0 0 auto;color:var(--faint);transition:transform .2s;}
.acc[open] .chev{transform:rotate(180deg);}
.acc .body{padding:2px 16px 16px;border-top:1px solid var(--border-soft);margin-top:-1px;}
.acc .body{font-size:14.5px;color:var(--text);}
.acc .body h4{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.acc .body ul{margin:8px 0;padding-left:20px;}
.acc .body li{margin:5px 0;}
.acc .body p{margin:8px 0;}
.acc .body strong{color:var(--text);}
code{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--border-soft);border-radius:6px;padding:1px 5px;font-size:12.5px;}
pre{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;padding:12px;overflow-x:auto;margin:8px 0;}
pre code{background:none;border:none;padding:0;color:var(--text);font-size:12.5px;line-height:1.6;}
.tip{border-left:3px solid var(--flag);background:color-mix(in srgb,var(--flag) 10%,transparent);padding:10px 12px;border-radius:8px;margin:12px 0;font-size:13.5px;}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0;display:block;overflow-x:auto;}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border-soft);vertical-align:top;}
.tbl th{color:var(--muted);font-weight:700;white-space:nowrap;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px;
  border:1px solid transparent;cursor:pointer;transition:transform .05s,background .15s,border-color .15s;
  min-height:46px;width:100%;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border);}
.btn-row{display:flex;gap:10px;}
.btn-sm{padding:9px 14px;min-height:40px;font-size:14px;width:auto;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ---------- Progress ---------- */
.bar{height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}

/* ---------- Quiz ---------- */
.q-meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin:10px 0;}
.timer{font-weight:800;font-variant-numeric:tabular-nums;}
.timer.warn{color:var(--flag);} .timer.danger{color:var(--no);}
.q-dom{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);}
.q-text{font-size:18px;font-weight:650;letter-spacing:-.01em;margin:6px 0 6px;text-wrap:pretty;}
.q-hint{font-size:12.5px;color:var(--muted);margin-bottom:12px;}
.opt{
  display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--border);border-radius:13px;
  padding:13px 14px;margin-bottom:9px;cursor:pointer;background:var(--surface);transition:border-color .12s,background .12s;
}
.opt:active{transform:scale(.995);}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent);}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);}
.opt.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,transparent);}
.opt .mk{flex:0 0 auto;width:23px;height:23px;border-radius:7px;border:1.5px solid var(--faint);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--faint);}
.opt.multi .mk{border-radius:50%;}
.opt.sel .mk{border-color:var(--accent);color:var(--accent);}
.opt.ok .mk{border-color:var(--ok);color:var(--ok);}
.opt.bad .mk{border-color:var(--no);color:var(--no);}
.opt .ot{flex:1;font-size:14.5px;padding-top:1px;}
.explain{margin-top:4px;border-radius:12px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border-soft);font-size:13.5px;}
.explain .v{font-weight:800;margin-bottom:4px;}
.explain .v.ok{color:var(--ok);} .explain .v.no{color:var(--no);}
.q-nav{display:flex;gap:10px;margin-top:16px;}

.ring{--p:0;width:150px;height:150px;border-radius:50%;margin:6px auto 8px;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);
  display:grid;place-items:center;}
.ring .in{width:118px;height:118px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center;}
.ring .pct{font-size:32px;font-weight:800;}
.ring .lab{font-size:11px;color:var(--muted);}
.dbar{margin:9px 0;}
.dbar .r{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
.dbar .t{height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
.dbar .t>i{display:block;height:100%;background:var(--ok);}
.rev{border:1px solid var(--border);border-radius:12px;padding:12px 13px;margin-bottom:9px;background:var(--surface);}
.rev .b{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;margin-right:7px;}
.rev .b.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok);}
.rev .b.no{background:color-mix(in srgb,var(--no) 20%,transparent);color:var(--no);}

/* ---------- Flashcards ---------- */
.fc-wrap{perspective:1200px;margin:6px 0 4px;}
.fc{position:relative;width:100%;min-height:270px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s;}
.fc.flip{transform:rotateY(180deg);}
@media (prefers-reduced-motion:reduce){.fc{transition:none;}}
.fc .face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--border);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);
  padding:24px 22px;display:flex;flex-direction:column;justify-content:center;
}
.fc .face .tag{position:absolute;top:14px;left:16px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);}
.fc .face .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--faint);}
.fc .front{font-size:20px;font-weight:650;text-align:center;letter-spacing:-.01em;}
.fc .back{transform:rotateY(180deg);font-size:15.5px;line-height:1.55;}
.fc .back .tag{color:var(--accent);}
.fc-nav{display:flex;align-items:center;gap:10px;margin-top:12px;}
.fc-nav .count{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;min-width:56px;text-align:center;}

/* ---------- Resource lists (videos/audio) ---------- */
.res{display:flex;gap:13px;align-items:center;padding:13px 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);margin-bottom:10px;cursor:pointer;color:var(--text);}
.res:active{transform:scale(.995);}
.res .thumb{flex:0 0 auto;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);}
.res .thumb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.res .meta{flex:1;min-width:0;}
.res .meta b{display:block;font-size:14.5px;letter-spacing:-.01em;}
.res .meta span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;}
.res .dur{flex:0 0 auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;}
.empty{text-align:center;padding:34px 18px;color:var(--muted);}
.empty .big{width:56px;height:56px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 12px;color:var(--faint);}
.empty .big svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px;}
.empty p{margin:0 auto;font-size:13.5px;max-width:340px;}

/* ---------- Embedded player ---------- */
.embed{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:#000;box-shadow:var(--shadow);}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.embed-note{font-size:12px;color:var(--faint);margin:8px 2px 14px;text-align:center;}

.hidden{display:none!important;}
.foot{text-align:center;color:var(--faint);font-size:11.5px;padding:16px 8px 4px;}
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="logo">A</div>
    <div class="titles">
      <b>ACE Trainer</b>
      <span id="appbar-sub">Associate Cloud Engineer prep</span>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="theme-btn" aria-label="Toggle theme" title="Toggle light/dark">◐</button>
  </header>

  <main class="view">
    <!-- SECTIONS -->
    <section class="panel active" id="p-sections" role="tabpanel" aria-label="Sections"></section>
    <!-- PRACTICE -->
    <section class="panel" id="p-practice" role="tabpanel" aria-label="Practice"><div id="quiz-root"></div></section>
    <!-- FLASHCARDS -->
    <section class="panel" id="p-cards" role="tabpanel" aria-label="Flashcards"></section>
    <!-- VIDEOS -->
    <section class="panel" id="p-videos" role="tabpanel" aria-label="Videos"></section>
    <!-- AUDIO -->
    <section class="panel" id="p-audio" role="tabpanel" aria-label="Audio"></section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="Study modes">
    <button data-tab="sections" class="active" role="tab" aria-selected="true">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>Sections
    </button>
    <button data-tab="practice" role="tab" aria-selected="false">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>Practice
    </button>
    <button data-tab="cards" role="tab" aria-selected="false">
      <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg></span>Flashcards
    </button>
    <button data-tab="videos" role="tab" aria-selected="false">
      <span class="ic"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="M17 9l5-3v12l-5-3"/></svg></span>Videos
    </button>
    <button data-tab="audio" role="tab" aria-selected="false">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M3 10v4M7 7v10M11 4v16M15 8v8M19 6v12M23 10v4"/></svg></span>Audio
    </button>
  </nav>
</div>

<script>
/*
 * Google Cloud Associate Cloud Engineer (ACE) — Practice Question Bank
 * ---------------------------------------------------------------------
 * Each question object:
 *   {
 *     id:        unique string
 *     domain:    one of DOMAINS keys (1..5)
 *     type:      "single" | "multi"
 *     text:      question stem
 *     options:   [ "A ...", "B ..." ]  (text only, no letter prefix)
 *     answer:    index (single) or array of indices (multi)
 *     explanation: why the answer is correct
 *   }
 *
 * These questions are written in the style of the official ACE sample exam:
 * scenario-based, single best answer or "choose N", vendor-neutral phrasing
 * where possible, and grounded in current Google Cloud services.
 */

const DOMAINS = {
  1: "Setting up a cloud solution environment",
  2: "Planning and configuring a cloud solution",
  3: "Deploying and implementing a cloud solution",
  4: "Ensuring successful operation of a cloud solution",
  5: "Configuring access and security",
};

const EXAMS = [
  {
    id: "exam-1",
    title: "Practice Exam 1 — Core Fundamentals",
    description:
      "A balanced 25-question set covering all five domains. Great for your first full run.",
    minutes: 40,
    questions: [
      {
        id: "e1q1",
        domain: 1,
        type: "single",
        text: "Your company has an existing Google Cloud organization. You need to create a new project for the finance team and ensure its costs are billed to the corporate billing account. What is the correct order of operations?",
        options: [
          "Create the billing account, then create the project and it is linked automatically",
          "Create the project, then link it to the existing corporate billing account",
          "Create the project under a folder; billing is inherited from the folder automatically",
          "Enable the Cloud Billing API in the organization, then projects bill automatically",
        ],
        answer: 1,
        explanation:
          "Projects are not automatically linked to a billing account (and billing is not inherited from folders). You create the project, then explicitly link it to the corporate billing account. This can be done in the Console or with `gcloud billing projects link PROJECT_ID --billing-account=BILLING_ACCOUNT_ID`.",
      },
      {
        id: "e1q2",
        domain: 1,
        type: "single",
        text: "You want to run gcloud commands from your local terminal against a specific project without passing --project each time. Which command sets the active project in your configuration?",
        options: [
          "gcloud projects set-active PROJECT_ID",
          "gcloud config set project PROJECT_ID",
          "gcloud init project PROJECT_ID",
          "gcloud auth set-project PROJECT_ID",
        ],
        answer: 1,
        explanation:
          "`gcloud config set project PROJECT_ID` sets the project property in your active gcloud configuration, so subsequent commands use it by default. `gcloud init` walks you through creating a configuration interactively, but the direct property setter is `gcloud config set`.",
      },
      {
        id: "e1q3",
        domain: 5,
        type: "single",
        text: "A developer needs to view Compute Engine instances in a project but must not be able to start, stop, or modify them. Which predefined IAM role follows the principle of least privilege?",
        options: [
          "roles/compute.admin",
          "roles/compute.instanceAdmin.v1",
          "roles/compute.viewer",
          "roles/viewer",
        ],
        answer: 2,
        explanation:
          "`roles/compute.viewer` grants read-only access to Compute Engine resources. `roles/viewer` (a basic role) is broader than needed, and the two admin roles allow modification. Prefer the narrowest predefined role that meets the requirement.",
      },
      {
        id: "e1q4",
        domain: 2,
        type: "single",
        text: "You need object storage for infrequently accessed backups that will be kept for at least a year, with the lowest cost while still allowing occasional retrieval within milliseconds. Which Cloud Storage class is most appropriate?",
        options: ["Standard", "Nearline", "Coldline", "Archive"],
        answer: 2,
        explanation:
          "Coldline is designed for data accessed less than once a quarter with a 90-day minimum storage duration and low storage cost, while still offering millisecond access. Archive (365-day minimum) is cheapest but intended for data accessed less than once a year. For yearly-retained backups touched occasionally, Coldline balances cost and access.",
      },
      {
        id: "e1q5",

  {n:1, title:"Setting up a cloud environment", sub:"Projects · billing · CLI · resource hierarchy",
   html:`<h4>Resource hierarchy</h4>
     <p><code>Organization → Folders → Projects → Resources</code>. IAM and org policies set higher up are <strong>inherited</strong> downward. Folders group projects (e.g. per department) so one policy covers them all.</p>

     <ul>
       <li>Every resource lives in a <strong>project</strong>. A project must be linked to a <strong>billing account</strong> — this is <em>not</em> automatic and <em>not</em> inherited from a folder.</li>
       <li>One billing account can pay for many projects; a project has exactly one active billing account.</li>
       <li><strong>Budgets &amp; alerts</strong> notify you near a threshold — they do <em>not</em> stop resources by themselves.</li>

     <h4>Tooling</h4>

     <li><strong>Log sinks</strong> export to BigQuery (analyze), Cloud Storage (cheap retention) or Pub/Sub (stream). Aggregated sinks centralize many projects.</li>
     <li><strong>Quotas</strong> cap per-project resource use; request increases in IAM &amp; Admin → Quotas.</li>
     <li>Backups: <strong>snapshots</strong> (disks, + schedules) vs. <strong>machine images</strong> (whole VM).</li></ul>`},

  {n:5, title:"Configuring access &amp; security", sub:"IAM · service accounts · audit · encryption",
   html:`<h4>IAM = who · can do what · on which resource</h4>
     <table class="tbl"><tr><th>Role type</th><th>Notes</th></tr>
     <tr><td><strong>Basic</strong> (Owner/Editor/Viewer)</td><td>Broad — avoid for least privilege</td></tr>
     <tr><td><strong>Predefined</strong></td><td>Service-specific, curated — preferred default</td></tr>
     <tr><td><strong>Custom</strong></td><td>Your chosen permissions when nothing fits</td></tr></table>
     <ul><li><strong>Least privilege</strong> is the guiding rule; grant to <strong>groups</strong>, not individuals.</li>
     <li><strong>Deny policies</strong> are evaluated first and override allow grants.</li></ul>
     <h4>Service accounts</h4>
     <ul><li>Attach an SA to a VM with minimal roles → app gets short-lived creds automatically. <strong>Avoid downloaded JSON keys.</strong></li>
     <li><code>serviceAccountUser</code> = act as an SA; <code>serviceAccountTokenCreator</code> = impersonate/mint tokens.</li>
     <li>Leaked key? <strong>Disable/delete it immediately</strong>, then rotate.</li></ul>
     <h4>Governance</h4>
     <ul><li><strong>Org Policy</strong> constraints enforce config rules (e.g. ban external IPs). IAM = who can act; Org Policy = what's allowed.</li>
     <li><strong>Audit Logs</strong>: Admin Activity (always on — who changed what). <strong>Secret Manager</strong> for secrets. <strong>CMEK</strong> (Cloud KMS) for your own keys.</li></ul>`},

  {d:1,q:"Correct resource hierarchy order?",a:"Organization → Folders → Projects → Resources."},
  {d:1,q:"Is a new project auto-linked to billing?",a:"No — you must link it explicitly; it isn't inherited from a folder."},
  {d:1,q:"Scope of a VM vs. subnet vs. VPC?",a:"VM = zonal, subnet = regional, VPC = global."},
  {d:4,q:"What must you install for VM memory metrics?",a:"The Ops Agent (CPU/disk/network are collected by default)."},
  {d:4,q:"Retain logs cheaply for compliance?",a:"A log sink exporting to Cloud Storage (or BigQuery to analyze)."},
  {d:4,q:"Automate daily disk backups?",a:"A snapshot schedule (resource policy) attached to the disk."},
  {d:5,q:"Which IAM policy wins — allow or deny?",a:"Deny — it's evaluated first and overrides allow grants."},
  {d:5,q:"Role to let a principal run a VM as a service account?",a:"roles/iam.serviceAccountUser."},
  {d:5,q:"Where to store passwords / API keys securely?",a:"Secret Manager (encrypted, versioned, IAM-controlled)."},

];

/* YT_PLAYLIST: a YouTube playlist ID (the PL... value). If set, the Videos tab
   embeds the whole playlist as one inline player. Set to "" to disable.       */
var YT_PLAYLIST = "PLR1fEU68qlN0"; // TODO: confirm full playlist ID
/* Optional extra single videos as cards: {title, by, dur, url}. */
var VIDEOS = [];

var AUDIO = []; // e.g. {title:"Domain 1 walkthrough", by:"You", dur:"12:40", url:"https://.../d1.mp3"}

/* =====================================================================
   Rendering
   ===================================================================== */
var $ = function(s,r){return (r||document).querySelector(s);};
var esc = function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};

/* ----- Sections ----- */
function renderSections(){
  var el = $("#p-sections");
  var h = '<div class="panel-head"><span class="eyebrow">Study guide</span><h1>Section breakdowns</h1><p>Tap a section to expand it. Everything else stays tucked away.</p></div>';
  SECTIONS.forEach(function(s,i){
    h += '<details class="acc"'+(i===0?' open':'')+'>'+

      '<span class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></span>'+
      '</summary><div class="body">'+s.html+'</div></details>';
  });
  h += '<p class="foot">ACE Trainer v'+APP_VERSION+' · independent study aid.</p>';

/* ----- Flashcards ----- */
var fcDeck=[], fcIdx=0, fcFilter=0;
function buildDeck(){
  fcDeck = CARDS.map(function(c,i){return {c:c,i:i};})
    .filter(function(x){return fcFilter===0 || x.c.d===fcFilter;});
  fcIdx = 0;
}
function renderCardsShell(){
  var el = $("#p-cards");
  var chips = '<div class="chips"><button class="chip'+(fcFilter===0?' active':'')+'" data-f="0">All</button>';
  [1,2,3,4,5].forEach(function(d){chips+='<button class="chip'+(fcFilter===d?' active':'')+'" data-f="'+d+'">Domain '+d+'</button>';});
  chips += '</div>';
  el.innerHTML = '<div class="panel-head"><span class="eyebrow">Active recall</span><h1>Flashcards</h1><p>Tap the card to flip. Swipe through the deck to drill key facts.</p></div>'+
    chips+'<div id="fc-mount"></div>';
  el.querySelectorAll(".chip").forEach(function(b){b.addEventListener("click",function(){fcFilter=+b.dataset.f;buildDeck();renderCardsShell();mountCard();});});
  mountCard();
}
function mountCard(){
  var m = $("#fc-mount"); if(!m) return;
  if(!fcDeck.length){ m.innerHTML='<div class="empty"><b>No cards here yet</b></div>'; return; }
  var it = fcDeck[fcIdx], c = it.c;
  m.innerHTML =
    '<div class="fc-wrap"><div class="fc" id="thecard">'+
      '<div class="face front"><span class="tag">Domain '+c.d+'</span><div>'+c.q+'</div><span class="hint">Tap to reveal</span></div>'+
      '<div class="face back"><span class="tag">Answer</span><div class="back-body">'+c.a+'</div><span class="hint">Tap to flip back</span></div>'+
    '</div></div>'+
    '<div class="fc-nav">'+
      '<button class="btn btn-ghost btn-sm" id="fc-prev" style="flex:0 0 auto;">‹ Prev</button>'+
      '<div class="count">'+(fcIdx+1)+' / '+fcDeck.length+'</div>'+
      '<button class="btn btn-ghost btn-sm" id="fc-next" style="flex:0 0 auto;margin-left:auto;">Next ›</button>'+
      '<button class="btn btn-ghost btn-sm" id="fc-shuf" style="flex:0 0 auto;">⤮ Shuffle</button>'+
    '</div>';
  var card = $("#thecard");
  card.addEventListener("click",function(){card.classList.toggle("flip");});
  $("#fc-prev").addEventListener("click",function(){fcIdx=(fcIdx-1+fcDeck.length)%fcDeck.length;mountCard();});
  $("#fc-next").addEventListener("click",function(){fcIdx=(fcIdx+1)%fcDeck.length;mountCard();});
  $("#fc-shuf").addEventListener("click",function(){for(var i=fcDeck.length-1;i>0;i--){var j=rnd(i+1);var t=fcDeck[i];fcDeck[i]=fcDeck[j];fcDeck[j]=t;}fcIdx=0;mountCard();});
}

function iconVideo(){return '<svg viewBox="0 0 24 24"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="M17 9l5-3v12l-5-3"/></svg>';}

/* =====================================================================
   Quiz engine (mounts in #quiz-root within the Practice tab)
   ===================================================================== */
var LT=["A","B","C","D","E","F"];
function rnd(n){ if(window.crypto&&window.crypto.getRandomValues){var u=new Uint32Array(1);window.crypto.getRandomValues(u);return u[0]%n;} return Math.floor(n*0.5);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(s){var m=Math.floor(s/60),x=s%60;return m+":"+String(x).padStart(2,"0");}

var qExam=null,qOrder=[],qCur=0,qAns={},qRev={},qMode="exam",qTimer=null,qRem=0;

function quizHome(){
  stopTimer();
  var root=$("#quiz-root");
  if(!EXAMS.length){root.innerHTML='<div class="empty"><b>No practice exams loaded</b><p>The question bank (data/questions.js) did not load.</p></div>';return;}
  var total=EXAMS.reduce(function(n,e){return n+e.questions.length;},0);
  var h='<div class="panel-head"><span class="eyebrow">Test yourself</span><h1>Practice exams</h1><p>'+EXAMS.length+' exams · '+total+' questions · instant explanations.</p></div><div class="stack">';
  EXAMS.forEach(function(e){
    h+='<div class="card" style="padding:16px;">'+
      '<div class="q-dom" style="margin-bottom:4px;">'+e.questions.length+' questions · pass ≥ 70%</div>'+
      '<b style="font-size:16px;letter-spacing:-.01em;">'+esc(e.title)+'</b>'+
      '<p style="color:var(--muted);font-size:13.5px;margin:6px 0 14px;">'+esc(e.description)+'</p>'+
      '<div class="btn-row"><button class="btn btn-primary" data-s="'+e.id+'" data-m="exam">Timed exam</button>'+
      '<button class="btn btn-ghost" data-s="'+e.id+'" data-m="practice">Practice</button></div></div>';
  });
  h+='</div>';
  root.innerHTML=h;
  root.querySelectorAll("[data-s]").forEach(function(b){b.addEventListener("click",function(){startExam(b.dataset.s,b.dataset.m);});});
}
function startExam(id,m){
  qExam=EXAMS.find(function(e){return e.id===id;}); if(!qExam)return;
  qMode=m; qOrder=shuffle(qExam.questions.map(function(_,i){return i;})); qCur=0; qAns={}; qRev={};
  if(m==="exam"){qRem=(qExam.minutes||40)*60;startTimer();}
  renderQ();
}
function startTimer(){stopTimer();qTimer=setInterval(function(){qRem--;tick();if(qRem<=0){stopTimer();finish();}},1000);}
function stopTimer(){if(qTimer)clearInterval(qTimer);qTimer=null;}
function tick(){var el=$("#timer");if(!el)return;el.textContent=fmt(Math.max(0,qRem));el.classList.toggle("warn",qRem<=300&&qRem>60);el.classList.toggle("danger",qRem<=60);}
function correct(q,sel){
  if(q.type==="multi"){if(!Array.isArray(sel))return false;var a=q.answer.slice().sort(),b=sel.slice().sort();return a.length===b.length&&a.every(function(v,i){return v===b[i];});}
  return sel===q.answer;
}
function renderQ(){
  var root=$("#quiz-root"),q=qExam.questions[qOrder[qCur]],sel=qAns[q.id],rev=!!qRev[q.id],multi=q.type==="multi";
  var h='<div class="q-meta"><span><strong>'+esc(qExam.title)+'</strong></span>'+
    (qMode==="exam"?'<span class="timer" id="timer">'+fmt(qRem)+'</span>':'<button class="btn btn-ghost btn-sm" id="q-exit">Exit</button>')+'</div>'+
    '<div class="bar"><i style="width:'+((qCur+1)/qOrder.length*100)+'%"></i></div>'+
    '<div class="q-meta"><span>Question '+(qCur+1)+' of '+qOrder.length+'</span><span>'+Object.keys(qAns).length+' answered</span></div>'+
    '<div class="q-dom">Domain '+q.domain+' · '+esc(DOMAINS[q.domain])+'</div>'+
    '<div class="q-text">'+esc(q.text)+'</div>'+
    (multi?'<div class="q-hint">Select all that apply ('+q.answer.length+' correct).</div>':'')+
    '<div id="opts">';
  q.options.forEach(function(opt,i){
    var s=multi?(Array.isArray(sel)&&sel.indexOf(i)>-1):sel===i;
    var isC=multi?q.answer.indexOf(i)>-1:q.answer===i;
    var cls="opt"+(multi?" multi":""),mk=LT[i];
    if(rev){if(isC){cls+=" ok";mk="✓";}else if(s){cls+=" bad";mk="✕";}}
    else if(s)cls+=" sel";
    h+='<div class="'+cls+'" data-o="'+i+'"><div class="mk">'+mk+'</div><div class="ot">'+esc(opt)+'</div></div>';
  });
  h+='</div>';
  if(rev){var ok=correct(q,sel);h+='<div class="explain"><div class="v '+(ok?"ok":"no")+'">'+(ok?"✓ Correct":"✕ Not quite")+'</div>'+esc(q.explanation)+'</div>';}
  h+='<div class="q-nav">'+
    '<button class="btn btn-ghost" id="q-prev" '+(qCur===0?"disabled":"")+' style="flex:0 0 40%;">‹ Prev</button>'+
    (qMode==="practice"&&!rev?'<button class="btn btn-ghost" id="q-check">Check</button>':"")+
    (qCur<qOrder.length-1?'<button class="btn btn-primary" id="q-next">Next ›</button>':'<button class="btn btn-primary" id="q-fin">Finish</button>')+
    '</div>';
  root.innerHTML=h;
  if(qMode==="exam")tick();
  if(!rev)root.querySelectorAll(".opt").forEach(function(el){el.addEventListener("click",function(){pick(q,+el.dataset.o);});});
  bind("q-prev",function(){if(qCur>0){qCur--;renderQ();}});
  bind("q-next",function(){qCur++;renderQ();});
  bind("q-fin",finish);
  bind("q-check",function(){qRev[q.id]=true;renderQ();});
  bind("q-exit",function(){if(confirm("Exit this exam? Progress will be lost.")){stopTimer();quizHome();}});
}
function bind(id,fn){var el=document.getElementById(id);if(el)el.addEventListener("click",fn);}
function pick(q,i){
  if(q.type==="multi"){var a=Array.isArray(qAns[q.id])?qAns[q.id].slice():[];var k=a.indexOf(i);if(k>-1)a.splice(k,1);else a.push(i);qAns[q.id]=a;}
  else qAns[q.id]=i;
  renderQ();
}
function finish(){
  stopTimer();
  var c=0,per={};Object.keys(DOMAINS).forEach(function(d){per[d]={c:0,t:0};});
  qExam.questions.forEach(function(q){per[q.domain].t++;if(correct(q,qAns[q.id])){c++;per[q.domain].c++;}});
  var total=qExam.questions.length,pct=Math.round(c/total*100),pass=pct>=70;
  var db="";Object.keys(DOMAINS).forEach(function(d){var p=per[d];if(!p.t)return;var dp=Math.round(p.c/p.t*100);
    db+='<div class="dbar"><div class="r"><span>D'+d+' · '+esc(DOMAINS[d])+'</span><span>'+p.c+'/'+p.t+'</span></div><div class="t"><i style="width:'+dp+'%"></i></div></div>';});
  var rev="";qExam.questions.forEach(function(q,i){var ok=correct(q,qAns[q.id]);var sel=qAns[q.id];
    var st=q.type==="multi"?((Array.isArray(sel)&&sel.length)?sel.map(function(x){return LT[x];}).join(", "):"—"):(typeof sel==="number"?LT[sel]:"—");
    var co=q.type==="multi"?q.answer.map(function(x){return LT[x];}).join(", "):LT[q.answer];
    rev+='<div class="rev"><div style="font-weight:650;margin-bottom:4px;"><span class="b '+(ok?"ok":"no")+'">'+(ok?"CORRECT":"MISSED")+'</span>Q'+(i+1)+'. '+esc(q.text)+'</div>'+
      '<div style="font-size:12.5px;color:var(--muted);margin:3px 0;">You: <strong>'+st+'</strong> · Correct: <strong>'+co+'</strong></div>'+
      '<div class="explain" style="margin-top:6px;">'+esc(q.explanation)+'</div></div>';});
  $("#quiz-root").innerHTML=
    '<div class="panel-head" style="text-align:center;"><h1>'+esc(qExam.title)+'</h1></div>'+
    '<div class="ring" style="--p:'+pct+'"><div class="in"><div><div class="pct">'+pct+'%</div><div class="lab">'+c+'/'+total+' correct</div></div></div></div>'+
    '<p style="text-align:center;font-weight:800;color:'+(pass?"var(--ok)":"var(--no)")+';">'+(pass?"🎉 Pass — cleared 70%":"Keep going — aim for 70%+")+'</p>'+
    '<div class="card" style="padding:16px;"><b>Score by domain</b><div style="margin-top:10px;">'+db+'</div></div>'+
    '<div class="q-nav" style="margin:16px 0;"><button class="btn btn-primary" id="q-retry">Retake</button><button class="btn btn-ghost" id="q-home">All exams</button></div>'+
    '<h1 style="font-size:19px;margin:8px 0 10px;">Answer review</h1>'+rev;
  bind("q-retry",function(){startExam(qExam.id,qMode);});
  bind("q-home",quizHome);
  $("#p-practice").scrollIntoView({block:"start"});
}

/* =====================================================================
   Tab router + theme
   ===================================================================== */
var built={sections:false,practice:false,cards:false,videos:false,audio:false};
function show(tab){
  document.querySelectorAll(".tabbar button").forEach(function(b){var on=b.dataset.tab===tab;b.classList.toggle("active",on);b.setAttribute("aria-selected",on?"true":"false");});
  document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("active");});
  $("#p-"+tab).classList.add("active");
  if(!built[tab]){
    if(tab==="sections")renderSections();
    else if(tab==="practice")quizHome();
    else if(tab==="cards"){buildDeck();renderCardsShell();}
    else if(tab==="videos")renderVideos();
    else if(tab==="audio")renderAudio();
    built[tab]=true;
  }
  try{location.hash=tab;}catch(e){}
  window.scrollTo(0,0);
}
document.querySelectorAll(".tabbar button").forEach(function(b){b.addEventListener("click",function(){show(b.dataset.tab);});});

/* theme */
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("ace-theme",t);}catch(e){}}
$("#theme-btn").addEventListener("click",function(){
  var cur=document.documentElement.getAttribute("data-theme");
  if(!cur){cur=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}
  applyTheme(cur==="dark"?"light":"dark");
});
try{var saved=localStorage.getItem("ace-theme");if(saved)document.documentElement.setAttribute("data-theme",saved);}catch(e){}

/* boot — honor #hash deep link */
var start=(location.hash||"").replace("#","");
if(["sections","practice","cards","videos","audio"].indexOf(start)<0)start="sections";
show(start);
})();
</script>
